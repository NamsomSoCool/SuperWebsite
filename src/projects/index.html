<!DOCTYPE html>
<html lang="en">

<head>
  <base href="/SuperWebsite/">
  <link rel="preload" href="/SuperWebsite/assets/fonts/Futura.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Leon Joensen</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/chillaxbear.jpg" type="image/jpeg">

  <style>
    body {
      background: var(--black);
      color: var(--text);

      opacity: 1;
      animation: none;
      padding-top: 80px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .page-kicker {
      text-align: center;
      letter-spacing: 0.4em;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .page-title {
      text-align: center;
      font-size: 96px;
      line-height: 1.1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px 40px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: scale(0.92);
      animation:
        titlePop 0.7s cubic-bezier(.2, .8, .2, 1) .1s forwards,
        titleFloat 6s ease-in-out .9s infinite,
        titleGlow 2.6s ease-in-out .9s infinite;
    }

    .page-title-wrap {
      text-align: center;
      margin-bottom: 64px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(240px, 1fr));
      gap: 28px;
      align-items: start;
    }

    .project-card {
      background: var(--panel);
      border: 4px solid var(--red);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 360px;
      opacity: 0;
      transition: transform .2s ease, box-shadow .2s ease;
      position: relative;
      transform: translateY(8px) scale(0.98);
      --delay: 0.1s;
    }

    .project-card::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      box-shadow:
        0 0 20px rgba(255, 43, 79, 0.85),
        0 0 60px rgba(255, 43, 79, 0.55),
        0 0 120px rgba(255, 43, 79, 0.35);
    }

    .project-card-link {
      text-decoration: none;
      color: inherit;
    }

    .project-card:nth-child(1) {
      --delay: .1s;
      animation-delay: var(--delay);
    }

    .project-card:nth-child(2) {
      --delay: .2s;
      animation-delay: var(--delay);
    }

    .project-card:nth-child(3) {
      --delay: .3s;
      animation-delay: var(--delay);
    }

    .project-card:nth-child(4) {
      --delay: .4s;
      animation-delay: var(--delay);
    }

    .project-card:nth-child(5) {
      --delay: .5s;
      animation-delay: var(--delay);
    }

    .project-card:nth-child(6) {
      --delay: .6s;
      animation-delay: var(--delay);
    }

    .project-media {
      position: relative;
      background: #1a1a1a;
    }

    .project-media img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .35s ease;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
    }

    .project-title {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .project-card:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(255, 43, 79, 0.28);
    }

    .project-card:hover::after {
      opacity: 1;
    }

    .project-card:hover .project-media img {
      transform: scale(1.02);
    }

    .media-placeholder {
      display: grid;
      place-items: center;
      height: 100%;
      border: 2px dashed #f0a100;
      color: #f0a100;
      font-weight: 700;
      font-size: 0.75rem;
      text-align: center;
      padding: 0 12px;
    }

    .card-body {
      position: relative;
      padding: 18px 96px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px) scale(0.98);
    }

    .project-badge {
      position: absolute;
      right: 18px;
      bottom: 6px;
      width: 84px;
      height: 84px;
      background: transparent;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      object-fit: contain;
      display: block;
    }

    .project-title {
      font-size: 1.2rem;
      line-height: 1.25;
      margin-top: 4px;
    }

    .tag {
      background: #3a3a3a;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.75rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .tag-modding {
      background: #4a90e2;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .tag-featured {
      background: var(--red);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .tag-side {
      background: #8757C6;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .tag-jam {
      background: #FF28B5;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .8rem;
      white-space: nowrap;
    }

    @media (max-width: 1024px) {
      .projects-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }
    }

    @media (max-width: 768px) {

      main {
        padding: 40px 18px 80px;
      }

      .page-title {
        font-size: 3rem;
        line-height: 1.1;
        padding: 10px 24px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .page-title {
        font-size: 2.4rem;
        line-height: 1.1;
        padding: 8px 20px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }
    }

    @keyframes pageFadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes cardRise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes mediaReveal {
      from {
        opacity: 0;
        transform: scale(0.98);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes bodyFade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleGlow {

      0%,
      100% {
        box-shadow:
          0 0 0 rgba(255, 255, 255, 0),
          0 0 0 rgba(255, 255, 255, 0),
          0 14px 32px rgba(0, 0, 0, 0.45);
      }

      50% {
        box-shadow:
          0 0 14px rgba(255, 255, 255, 0.42),
          0 0 32px rgba(255, 255, 255, 0.34),
          0 18px 44px rgba(0, 0, 0, 0.55);
      }
    }

    @keyframes titleFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes titlePop {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }

      70% {
        opacity: 1;
        transform: scale(1.02);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes tagPop {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.9);
      }

      60% {
        opacity: 1;
        transform: translateY(-2px) scale(1.06);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .project-card.card-animate {
      animation: tagPop 0.7s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--card-delay, 0s);
    }

    .project-card.card-animate .project-media img {
      animation: tagPop 0.7s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--media-delay, 0.08s);
    }

    .project-card.card-animate .card-body {
      animation: tagPop 0.7s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--body-delay, 0.16s);
    }

    .project-card.card-done {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .project-card.card-done .project-media img,
    .project-card.card-done .card-body {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .project-card.card-done:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(255, 43, 79, 0.28);
    }

    .project-card.card-done:hover .project-media img {
      transform: scale(1.02);
    }

    @media (hover: none) {
      .project-card:active {
        transform: translateY(-4px) scale(1.015);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.55),
          0 0 30px rgba(255, 43, 79, 0.28);
      }

      .project-card:active .project-media img {
        transform: scale(1.02);
      }
    }
  </style>
  <script src="assets/js/navbar.js" defer></script>
</head>

<body>
  <site-header></site-header>

  <main>
    <div class="page-title-wrap">
      <h1 class="page-title">My Projects</h1>
    </div>

    <section class="projects-grid">
      <a class="project-card project-card-link" href="/SuperWebsite/projects/chillaxscraps/"
        aria-label="Open ChillaxSCRAPS project page">
        <div class="project-media">
          <img src="assets/images/chillax1.png" alt="ChillaxSCRAPS">
        </div>
        <div class="card-body">
          <h2 class="project-title">ChillaxSCRAPS</h2>
          <span class="tag tag-modding">Modding</span>
          <img class="project-badge" src="assets/images/logos/unity.png" alt="Unity">
        </div>
      </a>

      <a class="project-card project-card-link" href="/SuperWebsite/projects/projectliminal/" aria-label="Open Project Liminal page">
        <div class="project-media">
          <img src="assets/images/project linamal.png" alt="Project Liminal">
        </div>
        <div class="card-body">
          <h2 class="project-title">Project Liminal</h2>
          <span class="tag tag-featured">Game Project</span>
          <img class="project-badge" src="assets/images/logos/unreal.png" alt="Unreal Engine">
        </div>
      </a>

      <a class="project-card project-card-link" href="/SuperWebsite/projects/chillaxyumyum/" aria-label="Open Chillax Yum-Yum page">
        <div class="project-media">
          <img src="assets/images/chillaxyumyum.jpg" alt="Chillax Yum-Yum">
        </div>
        <div class="card-body">
          <h2 class="project-title">Chillax Yum-Yum</h2>
          <span class="tag tag-side">Side Project</span>
          <img class="project-badge" src="assets/images/logos/unity.png" alt="Unity">
        </div>
      </a>

      <a class="project-card project-card-link" href="/SuperWebsite/projects/cosmicyenjai/" aria-label="Open Cosmic YenJai page">
        <div class="project-media">
          <img src="assets/images/yenjai.jpg" alt="Cosmic YenJai">
        </div>
        <div class="card-body">
          <h2 class="project-title">Cosmic YenJai</h2>
          <span class="tag tag-side">Side Project</span>
          <img class="project-badge" src="assets/images/logos/unity.png" alt="Unity">
        </div>
      </a>

      <a class="project-card project-card-link" href="/SuperWebsite/projects/gnomesplash/" aria-label="Open Gnome Splash page">
        <div class="project-media">
          <img src="assets/images/gnomesplash.png" alt="Placeholder 5">
        </div>
        <div class="card-body">
          <h2 class="project-title">Gnome Splash</h2>
          <span class="tag tag-featured">Game Project</span>
          <img class="project-badge" src="assets/images/logos/unreal.png" alt="Unreal Engine">
        </div>
      </a>

      <a class="project-card project-card-link" href="/SuperWebsite/projects/realfps/" data-project="real-fps"
        aria-label="Open Real FPS page">
        <div class="project-media">
          <img src="assets/images/realfps.png" alt="Real FPS">
        </div>
        <div class="card-body">
          <h2 class="project-title">Real FPS</h2>
          <span class="tag tag-jam">Game Jam</span>
          <img class="project-badge" src="assets/images/logos/unreal.png" alt="Unreal Engine">
        </div>
      </a>
    </section>
  </main>

  <audio id="real-fps-audio" preload="auto">
    <source src="assets/audio/Trash Beat Trade Marked LMAO.ogg" type="audio/ogg">
  </audio>

  <script>
    const signal = window.__portfolioPageSignal;
    const realFpsCard = document.querySelector('[data-project="real-fps"]');
    const realFpsAudio = document.getElementById('real-fps-audio');

    if (realFpsCard && realFpsAudio) {
      const maxVolume = 0.3;
      realFpsAudio.volume = maxVolume;
      realFpsCard.addEventListener('pointerenter', () => {
        realFpsAudio.currentTime = 0;
        realFpsAudio.play().catch(() => { });
      }, signal ? { signal } : undefined);

      realFpsCard.addEventListener('pointerleave', () => {
        realFpsAudio.pause();
        realFpsAudio.currentTime = 0;
      }, signal ? { signal } : undefined);
    }
  </script>

  <script>
    (() => {
      const signal = window.__portfolioPageSignal;
      const cards = document.querySelectorAll(".project-card");
      if (!cards.length) return;

      cards.forEach((card, index) => {
        const baseDelay = Math.max(0, index) * 0.08;
        card.style.setProperty("--card-delay", `${baseDelay}s`);
        card.style.setProperty("--media-delay", `${baseDelay + 0.08}s`);
        card.style.setProperty("--body-delay", `${baseDelay + 0.16}s`);
        card.classList.add("card-animate");
        const finishDelay = baseDelay + 0.16 + 0.7 + 0.05;
        window.setTimeout(() => {
          card.classList.remove("card-animate");
          card.classList.add("card-done");
        }, finishDelay * 1000);
      });
    })();
    </script>

  <script>
    (() => {
      const signal = window.__portfolioPageSignal;
      const projectLinks = document.querySelectorAll(".project-card-link");
      if (!projectLinks.length) return;

      projectLinks.forEach(link => {
        link.addEventListener("click", () => {
          try {
            sessionStorage.setItem("portfolioBackTarget", "projects.html");
            sessionStorage.setItem("portfolioBackLabel", "Back to Projects");
          } catch (error) {
            // Ignore storage failures.
          }
        }, signal ? { signal } : undefined);
      });
    })();
    </script>
</body>

</html>
